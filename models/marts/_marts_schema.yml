version: 2

models:
  - name: dim_zones
    description: TLC taxi zone lookup.
    columns:
      - name: location_id
        description: Unique TLC Taxi Zone identifier (1–265).
        tests:
          - unique
          - not_null
  - name: fct_trips
    description: Trip-level view with time features and pickup/dropoff zones.
    columns:
      - name: pickup_location_id
        tests:
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('dim_zones')
                field: location_id
  - name: fct_daily_citywide_metrics
    description: Daily citywide demand and revenue metrics.
    columns:
      - name: pickup_date
        description: Calendar date.
        tests:
          - unique
          - not_null
  - name: fct_daily_zone_metrics
    description: Daily demand and revenue metrics by pickup zone.
    columns:
      - name: pickup_date
        description: Calendar date.
        tests:
          - not_null
      - name: pickup_location_id
        description: Pickup zone ID.
        tests:
          - not_null
