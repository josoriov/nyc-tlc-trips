version: 2

models:
  - name: stg_taxi__yellow_trips
    description: Cleaned and typed yellow taxi trips for the configured date window.
    columns:
      - name: payment_type
        description: "Payment method (1=Card, 2=Cash, 3=No charge, 4=Dispute, 5=Unknown, 6=Voided)."
        tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: [1, 2, 3, 4, 5, 6]
                quote: false
