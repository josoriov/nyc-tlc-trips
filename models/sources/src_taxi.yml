version: 2

sources:
  - name: taxi
    description: >
      NYC Taxi & Limousine Commission trip record data hosted as a BigQuery
      public dataset. Contains pick-up/drop-off times, locations, fares, and
      payment details for yellow taxi trips.
    database: bigquery-public-data
    schema: new_york_taxi_trips
    tables:
      - name: taxi_zones
        identifier: taxi_zone_geom
        description: Public TLC taxi zone names and boroughs.
      - name: yellow_trips
        identifier: tlc_yellow_trips_2022
        description: >
          Yellow taxi trip records for 2022. Each row represents a single
          metered trip including timestamps, locations, distances, fares,
          and payment information.
        columns:
          - name: vendor_id
            description: Code indicating the TPEP provider (1 = Creative Mobile Technologies, 2 = VeriFone).
          - name: pickup_datetime
            description: Date and time when the meter was engaged.
          - name: dropoff_datetime
            description: Date and time when the meter was disengaged.
          - name: passenger_count
            description: Number of passengers in the vehicle (driver-entered).
          - name: trip_distance
            description: Elapsed trip distance in miles reported by the taximeter.
          - name: pickup_location_id
            description: TLC Taxi Zone where the meter was engaged.
          - name: dropoff_location_id
            description: TLC Taxi Zone where the meter was disengaged.
          - name: rate_code
            description: >
              Final rate code in effect at the end of the trip
              (1=Standard, 2=JFK, 3=Newark, 4=Nassau/Westchester, 5=Negotiated, 6=Group ride).
          - name: store_and_fwd_flag
            description: >
              Whether the trip data was held in vehicle memory before sending
              (Y=store and forward, N=not a store and forward trip).
          - name: payment_type
            description: >
              How the passenger paid
              (1=Credit card, 2=Cash, 3=No charge, 4=Dispute, 5=Unknown, 6=Voided).
          - name: fare_amount
            description: Time-and-distance fare calculated by the meter.
          - name: extra
            description: Miscellaneous extras and surcharges (rush hour, overnight).
          - name: mta_tax
            description: MTA tax automatically triggered based on the metered rate.
          - name: tip_amount
            description: Tip amount (auto-populated for credit card tips; cash tips not included).
          - name: tolls_amount
            description: Total amount of all tolls paid in the trip.
          - name: imp_surcharge
            description: Improvement surcharge assessed on hailed trips at the flag drop.
          - name: total_amount
            description: Total amount charged to passengers (excludes cash tips).
